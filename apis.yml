aid: wellster
name: Wellster
description: 'Wellster Healthtech Group is a German digital healthcare company founded in Munich in 2018
  by Dr. Manuel Nothelfer and Nico Hribernik. It operates a digital health ecosystem that integrates a
  diverse range of direct-to-patient medical brands across Europe, combining synchronous and asynchronous
  telemedicine with value-based, evidence-driven care. Wellster emphasizes German-based medical supervision,
  data stored on German servers, and treatments aligned with established clinical standards, acting as a
  structured filter and patient-routing layer for the healthcare system. It is backed by HV Capital and
  was added to the API Evangelist network as a portfolio lead. Wellster does not publish a public API,
  developer portal, or API documentation as of this enrichment pass.'
